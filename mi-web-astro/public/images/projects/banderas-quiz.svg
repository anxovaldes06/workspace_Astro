<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Pregunta del juego de banderas</title>
  <desc id="desc">Pantalla de concurso con una bandera y cuatro opciones de respuesta.</desc>
  <rect width="960" height="600" fill="#eaf3ed"/>
  <rect x="152" y="54" width="656" height="492" rx="32" fill="#fff" stroke="#d6e6da" stroke-width="4"/>
