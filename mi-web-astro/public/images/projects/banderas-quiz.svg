    <rect x="498" y="356" width="244" height="60" rx="15" fill="#f2f7f2" stroke="#dfe9e0" stroke-width="2"/><text x="620" y="394" text-anchor="middle" fill="#315840">Italia</text>
    <rect x="218" y="438" width="244" height="60" rx="15" fill="#f2f7f2" stroke="#dfe9e0" stroke-width="2"/><text x="340" y="476" text-anchor="middle" fill="#315840">Irlanda</text>
    <rect x="498" y="438" width="244" height="60" rx="15" fill="#e4f2e5" stroke="#82b78b" stroke-width="3"/><text x="620" y="476" text-anchor="middle" fill="#28603a">India</text>
  </g>
