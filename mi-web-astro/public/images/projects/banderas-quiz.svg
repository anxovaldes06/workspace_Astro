  <text x="480" y="158" text-anchor="middle" fill="#738579" font-family="Arial,sans-serif" font-size="19">¿A qué país pertenece esta bandera?</text>
  <rect x="374" y="190" width="212" height="124" rx="12" fill="#fff" stroke="#e5eae4" stroke-width="3"/>
  <path d="M382 198h196v36H382z" fill="#f1c84c"/><path d="M382 234h196v36H382z" fill="#fff"/><path d="M382 270h196v36H382z" fill="#61a576"/>
